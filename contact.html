  <main>
    <section class="neon-orange neon-flicker" style="text-align: center;">
      <!-- Inquiries -->
      <div class="neon-pink neon-flicker" style="margin-bottom: 2.5rem;">
        <h2>Inquiries</h2>
        <p class="plain-white">Drop fun facts, short stories, or anything else you'd like to share!</p>
        <div style="max-width: 700px; margin: 0 auto;">
          <form id="inquiry-form" style="display: flex; flex-direction: column; gap: 0.8rem; align-items: stretch;">
            <input 
              type="text" 
              id="inquiry-name" 
              placeholder="Your Name" 
              style="padding: 0.8rem; font-family: 'Press Start 2P', monospace; font-size: 0.6rem; background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.3); border-radius: 8px; color: white;" />
            <input 
              type="email" 
              id="inquiry-email" 
              placeholder="Your Email" 
              style="padding: 0.8rem; font-family: 'Press Start 2P', monospace; font-size: 0.6rem; background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.3); border-radius: 8px; color: white;" />
            <textarea 
              id="inquiry-message" 
              placeholder="Your Message" 
              rows="6"
              style="padding: 0.8rem; font-family: 'Press Start 2P', monospace; font-size: 0.6rem; background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.3); border-radius: 8px; color: white; resize: vertical;"></textarea>
            <button 
              type="submit" 
              style="padding: 0.8rem 2rem; font-family: 'Press Start 2P', monospace; font-size: 0.6rem; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.3); border-radius: 8px; color: white; cursor: pointer;">
              SUBMIT INQUIRY
            </button>
          </form>
          <div id="inquiry-message-status" class="plain-white" style="font-size: 0.5rem; min-height: 1rem; margin-top: 0.5rem;"></div>
        <p class="plain-white">For any further inquiries, please reach out through email.</p> 
        </div>
      </div>

      <div class="neon-pink neon-flicker">

      </div>

  <footer class="neon-yellow neon-flicker">
    <p>&copy; 2025 Fiona Daly</p>
  </footer>
  <script>
    // Inquiries -> Google Sheets via Apps Script (SEPARATE endpoint)
    // TODO: Replace with your dedicated Apps Script Web App URL for inquiries only
    const INQUIRY_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxsma0kSxS02XggQ2gbeLMWT4sjfZR6mCCxpH8r7s4j5nFQnQhknFN3scV6YvdDUEBm/exec';
    document.addEventListener('DOMContentLoaded', function() {
      const form = document.getElementById('inquiry-form');
      const nameInput = document.getElementById('inquiry-name');
      const emailInput = document.getElementById('inquiry-email');
      const messageInput = document.getElementById('inquiry-message');
      const statusDiv = document.getElementById('inquiry-message-status');

      if (!form) return;

      form.addEventListener('submit', function(e) {
        e.preventDefault();

        const name = (nameInput.value || '').trim();
        const email = (emailInput.value || '').trim();
        const message = (messageInput.value || '').trim();
        const timestamp = new Date().toLocaleString();

        if (!message) {
          statusDiv.textContent = 'Please enter a message.';
          statusDiv.style.color = '#ff0000';
          return;
        }

        statusDiv.textContent = 'Sending...';
        statusDiv.style.color = '#fff700';

        fetch(INQUIRY_SCRIPT_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            type: 'inquiry',
            name: name,
            email: email,
            message: message,
            timestamp: timestamp,
            source: 'Contact Page'
          })
        })
        .then(function(response) {
          if (!response.ok) throw new Error('Network response was not ok');
          statusDiv.textContent = 'Thanks! Your inquiry has been received!';
          statusDiv.style.color = '#39ff14';
          nameInput.value = '';
          emailInput.value = '';
          messageInput.value = '';
          setTimeout(function(){ statusDiv.textContent = ''; }, 4000);
        })
        .catch(function(error) {
          console.error(error);
          statusDiv.textContent = 'There was a problem submitting. Please try again later.';
          statusDiv.style.color = '#ff0000';
        });
      });
    });
  </script>
</body>
</html>
