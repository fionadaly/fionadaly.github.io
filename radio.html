<body class="neon-pink neon-flicker about-page" style="min-height: 100vh; margin: 0; padding: 0; overflow-x: hidden;">
  <a href="index.html" class="back-arrow" aria-label="Back to home">

  <header style="padding-top: 20vh; display: flex; flex-direction: column; align-items: center; justify-content: center;">
    <div style="display: flex; flex-direction: column; align-items: center; gap: 0.5rem;">
      <p style="margin-bottom: 100px;">WELCOME TO</p>
      <h1 class="neon-orange neon-flicker" style="font-size: 10rem; line-height: 1.1; letter-spacing: 0.5em; margin-top: 0;">THE...</h1>
      <p class="neon-orange neon-flicker">This is not a typo. Tune into the... every Tuesday at 10pm EST!</p>
      <p>88.1FM WMBR in Cambridge</p>
    </div>


  <section class="plain-white" id="playlists" style="margin-top: 2rem; text-align: center;">
    <h2 style="color: white; font-family: 'Press Start 2P', monospace; margin-bottom: 1rem;">Featured Playlists</h2>
    <p style="margin-bottom: 2rem; font-size: 0.8rem; color: white; font-family: 'Press Start 2P', monospace;">Tune into these curated playlists</p>
    
    <!-- Song Recommendation Input -->
    <div style="margin-bottom: 3rem; max-width: 600px; margin-left: auto; margin-right: auto;">
      <h3 style="color: white; font-family: 'Press Start 2P', monospace; font-size: 0.7rem; margin-bottom: 1rem;">RECOMMEND A SONG</h3>
      <form id="song-recommendation-form" style="display: flex; flex-direction: column; gap: 1rem; align-items: center;">
        <input 
          type="text" 
          id="song-input" 
          placeholder="Artist - Song Title" 
          style="
            width: 100%; 
            padding: 0.8rem; 
            font-family: 'Press Start 2P', monospace; 
            font-size: 0.6rem; 
            background: rgba(0, 0, 0, 0.3); 
            border: 1px solid rgba(255, 255, 255, 0.3); 
            border-radius: 8px; 
            color: white; 
            text-align: center;
            backdrop-filter: blur(10px);
          "
        />
        <button 
          type="submit" 
          style="
            padding: 0.8rem 2rem; 
            font-family: 'Press Start 2P', monospace; 
            font-size: 0.6rem; 
            background: rgba(255, 255, 255, 0.1); 
            border: 1px solid rgba(255, 255, 255, 0.3); 
            border-radius: 8px; 
            color: white; 
            cursor: pointer;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
          "
          onmouseover="this.style.background='rgba(255, 255, 255, 0.2)'; this.style.borderColor='rgba(255, 255, 255, 0.5)'"
          onmouseout="this.style.background='rgba(255, 255, 255, 0.1)'; this.style.borderColor='rgba(255, 255, 255, 0.3)'"
        >
          SUBMIT RECOMMENDATION
        </button>
      </form>
      <div id="recommendation-message" style="margin-top: 1rem; font-family: 'Press Start 2P', monospace; font-size: 0.5rem; color: white; min-height: 1rem;"></div>
    </div>
    
    <div id="playlist-container" class="playlist-container" style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 3rem; max-width: 1200px; margin: 0 auto;">
      <!-- Playlists will be generated by JavaScript -->
    </div>
  </section>

  <footer class="neon-yellow neon-flicker">
    <p>&copy; 2025 Fiona Daly</p>
  </footer>

      // ... and so on for all 26 playlists
    ];

    // Function to extract playlist ID from Spotify URL
    function extractPlaylistId(url) {
      const match = url.match(/playlist\/([a-zA-Z0-9]+)/);
      return match ? match[1] : null;
    }

    // Function to generate playlist HTML
    function generatePlaylistHTML(playlist) {
      const playlistId = extractPlaylistId(playlist.url);
      if (!playlistId) {
        console.error(`Invalid Spotify URL for playlist: ${playlist.title}`);
        return '';
      }
      
      return `
        <div class="playlist-item" style="width: 100%;">
          <iframe 
            style="border-radius: 12px; width: 100%; height: 400px;" 
            src="https://open.spotify.com/embed/playlist/${playlistId}?utm_source=generator&theme=0&view=list" 
            width="100%" 
            height="400" 
            frameBorder="0" 
            allowfullscreen="" 
            allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" 
            loading="lazy">
          </iframe>
        </div>
      `;
    }

    // Function to render all playlists
    function renderPlaylists() {
      const container = document.getElementById('playlist-container');
      if (!container) return;
      
      container.innerHTML = playlists.map(generatePlaylistHTML).join('');
    }

    // Initialize playlists when page loads
    document.addEventListener('DOMContentLoaded', function() {
      renderPlaylists();
      setupSongRecommendation();
    });

    // Song recommendation functionality
    function setupSongRecommendation() {
      const form = document.getElementById('song-recommendation-form');
      const input = document.getElementById('song-input');
      const messageDiv = document.getElementById('recommendation-message');

      form.addEventListener('submit', function(e) {
        e.preventDefault();
        
        const songRecommendation = input.value.trim();
        
        if (songRecommendation) {
          // Add to Google Sheet using Google Apps Script
          const timestamp = new Date().toLocaleString();
          
          // Show loading message
          messageDiv.textContent = 'Adding to playlist...';
          messageDiv.style.color = '#fff700';
          
          // Send to Google Apps Script (you'll need to replace with your actual script URL)
          fetch('https://script.google.com/macros/s/AKfycby_c-klegeN8u4fkh9QKLUwXQvygW9190LcZ-e1P2kQqS7mSV3q6O1-LKhIZFhBMQohfQ/exec', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
            },
            body: JSON.stringify({
              song: songRecommendation,
              timestamp: timestamp,
              source: 'Radio Show Website'
            })
          })
          .then(response => {
            if (response.ok) {
              // Show success message
              messageDiv.textContent = `Thanks! "${songRecommendation}" added to the playlist!`;
              messageDiv.style.color = '#39ff14';
              
              // Clear input
              input.value = '';
              
              // Hide message after 4 seconds
              setTimeout(() => {
                messageDiv.textContent = '';
              }, 4000);
            } else {
              throw new Error('Failed to add to sheet');
            }
          })
          .catch(error => {
            console.error('Error:', error);
            // Fallback: show success message anyway
            messageDiv.textContent = `Thanks! "${songRecommendation}" has been submitted!`;
            messageDiv.style.color = '#39ff14';
            input.value = '';
            
            setTimeout(() => {
              messageDiv.textContent = '';
            }, 4000);
          });
          
        } else {
          // Show error message
          messageDiv.textContent = 'Please enter a song recommendation!';
          messageDiv.style.color = '#ff0000';
          
          // Hide message after 2 seconds
          setTimeout(() => {
            messageDiv.textContent = '';
          }, 2000);
        }
      });
    }
  </script>
